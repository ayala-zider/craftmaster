<body class="bg-surface-dim text-on-surface min-h-screen flex items-center justify-center p-0 sm:p-4 font-body-md">
<!-- Mobile Viewport Container mimicking tactile creative journal canvas -->
<main class="w-full max-w-[430px] min-h-screen sm:min-h-0 sm:rounded-xl bg-background shadow-xl overflow-hidden flex flex-col relative border border-outline-variant/30">
<!-- TopAppBar Component (Rendered strictly according to JSON specification) -->
<header class="bg-surface text-primary border-b border-outline-variant/30 shadow-sm flex justify-between items-center w-full px-space-md py-space-sm max-w-[430px] mx-auto z-10">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="palette">palette</span>
<span class="text-headline-sm font-headline-sm font-bold text-primary tracking-tight">Craft Master</span>
</div>
<div class="flex items-center justify-center w-9 h-9 rounded-full bg-surface-container-high text-primary hover:bg-surface-container transition-colors duration-150">
<span class="material-symbols-outlined text-xl" data-icon="stars" data-weight="fill" style="font-variation-settings: 'FILL' 1;">stars</span>
</div>
</header>
<!-- Scrollable Content Canvas -->
<div class="flex-1 overflow-y-auto px-space-md pt-space-lg pb-space-2xl flex flex-col justify-between">
<div>
<!-- Brand Emblem / Avatar & Welcome Header -->
<div class="flex flex-col items-center text-center mb-space-xl">
<div class="relative w-20 h-20 rounded-full bg-surface-container-high border-2 border-outline-variant/40 flex items-center justify-center shadow-sm mb-space-md">
<div class="w-14 h-14 rounded-full bg-primary-fixed flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="palette" data-weight="fill" style="font-variation-settings: 'FILL' 1;">palette</span>
</div>
<!-- Playful small studio spark badge -->
<div class="absolute -bottom-1 -right-1 bg-secondary-container text-on-secondary-container w-7 h-7 rounded-full flex items-center justify-center border-2 border-background shadow-xs">
<span class="material-symbols-outlined text-sm" data-icon="brush">brush</span>
</div>
</div>
<h1 class="text-headline-lg font-headline-lg text-primary tracking-tight mb-space-2xs">Craft Master</h1>
<p class="text-body-md font-body-md text-on-surface-variant max-w-[280px]">Welcome back, crafter! Log in to continue your creative journey.</p>
</div>
<!-- Login Form Card -->
<form class="bg-surface-container-lowest/80 border border-outline-variant/30 rounded-lg p-space-lg shadow-sm space-y-space-md" onsubmit="event.preventDefault();">
<!-- Email / Phone Input -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-space-2xs" for="craft-identifier">
              Email or Phone Number
            </label>
<div class="relative">
<input class="w-full h-12 px-space-md rounded-full bg-surface-container-low border border-outline-variant/50 text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/60 focus:bg-surface-container-lowest focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="craft-identifier" placeholder="e.g. noa@craftmaster.art" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-3 text-outline-variant" data-icon="mail">mail</span>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-space-2xs" for="craft-password">
              Password
            </label>
<div class="relative">
<input class="w-full h-12 pl-space-md pr-12 rounded-full bg-surface-container-low border border-outline-variant/50 text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/60 focus:bg-surface-container-lowest focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" id="craft-password" placeholder="••••••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 top-2.5 p-1 rounded-full text-on-surface-variant/70 hover:text-primary transition-colors focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
<div class="flex justify-end mt-space-2xs">
<a class="text-label-md font-label-md text-primary hover:text-primary-container transition-colors" href="#">
                Forgot Password?
              </a>
</div>
</div>
<!-- Remember Me Checkbox -->
<div class="flex items-center gap-space-xs pt-space-2xs">
<input class="w-5 h-5 rounded-lg border-2 border-outline-variant text-primary focus:ring-primary/20 focus:ring-offset-0 bg-surface-container-low cursor-pointer transition-colors" id="remember-me" type="checkbox"/>
<label class="text-body-sm font-body-sm text-on-surface-variant cursor-pointer select-none" for="remember-me">
              Remember this device
            </label>
</div>
<!-- Primary Action CTA Button in Warm Red Brick -->
<button class="w-full h-12 bg-primary text-on-primary rounded-full font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-md hover:bg-primary-container active:scale-[0.98] transition-all duration-150 cursor-pointer" type="submit">
<span>Log In</span>
<span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider: OR -->
<div class="relative my-space-lg flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<span class="relative px-space-md bg-background text-label-sm font-label-sm text-outline tracking-wider">
            OR
          </span>
</div>
<!-- Secondary Social Login: Sign in with Google -->
<button class="w-full h-12 rounded-full bg-surface-container-lowest border border-outline-variant/40 hover:bg-surface-container-low text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-xs active:scale-[0.98] transition-all duration-150" type="button">
<svg aria-hidden="true" class="w-5 h-5" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.14z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.14C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.59H1.24C.45 8.16 0 9.97 0 12s.45 3.84 1.24 5.41l4.04-3.14z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.24 6.59l4.04 3.14c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span>Sign in with Google</span>
</button>
<!-- Don't have an account switch text -->
<div class="text-center mt-space-lg">
<p class="text-body-md font-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="font-bold text-primary hover:text-primary-container transition-colors inline-block ml-1 underline decoration-primary/40 underline-offset-4" href="#">
              Sign Up
            </a>
</p>
</div>
</div>
<!-- Footer Tagline & Creative Studio Touch -->
<footer class="mt-space-xl pt-space-md text-center">
<div class="inline-flex items-center gap-space-2xs px-space-md py-space-xs rounded-full bg-surface-container-high/60 border border-outline-variant/20 mb-space-xs">
<span class="material-symbols-outlined text-tertiary text-xs" data-icon="auto_awesome">auto_awesome</span>
<span class="text-label-sm font-label-sm text-tertiary">Warm &amp; gentle DIY space • Free &amp; joyful crafting</span>
</div>
</footer>
</div>
</main>
<!-- Lightweight micro-interaction for password visibility toggle -->
<script>
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('craft-password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  </script>
</body></html>
